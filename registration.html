<main class="container section-padding">
    <h1 class="text-center mb-4">Student Registration</h1>
    <p class="text-center">Complete the form to register your interest in our programs.</p>

    <form id="registrationForm" class="bg-white p-4 rounded shadow-sm">
        <div class="mb-3">
            <label for="studentName" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="studentName" required>
        </div>

        <div class="mb-3">
            <label for="studentEmail" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="studentEmail" required>
        </div>

        <div class="mb-3">
            <label for="studentPhone" class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="studentPhone" required>
        </div>

        <div class="mb-3">
            <label for="studentProgram" class="form-label">Choose a Program</label>
            <select class="form-select" id="studentProgram" required>
                <option value="">Select a program</option>
                <option value="Computer Engineering">Computer Engineering</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
                <option value="Electrical Engineering">Electrical Engineering</option>
            </select>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="privacyConsent" required>
            <label class="form-check-label" for="privacyConsent">I agree to the use of my information to respond to this request.</label>
        </div>

        <button type="submit" class="btn btn-primary">Submit Registration</button>
        <p id="registrationFeedback" class="mt-3" role="status" aria-live="polite"></p>
    </form>
</main>
